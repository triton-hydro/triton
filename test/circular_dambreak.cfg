#---------------------------------------------------------------------------
# Triton config file
#---------------------------------------------------------------------------

#---------------------------------------------------------------------------
# Mandatory input files
#---------------------------------------------------------------------------
dem_filename="../input/circular/circular_dambreak.dem"

#---------------------------------------------------------------------------
# Format=BIN or ASC or GTIFF
# Option=PAR or SEQ
#---------------------------------------------------------------------------
input_format=ASC
outfile_pattern="%s/%s/%s_%02d_%02d"
output_format=ASC
output_option=SEQ
output_folder=output_circular_dambreak

#---------------------------------------------------------------------------
# Hydrograph and flow locations information
#---------------------------------------------------------------------------
num_sources=0
hydrograph_filename=""
src_loc_file=""

#---------------------------------------------------------------------------
# Manning input files
#---------------------------------------------------------------------------
n_infile=""
const_mann=0.0

#---------------------------------------------------------------------------
# Runoff related information
#---------------------------------------------------------------------------
num_runoffs=0
runoff_filename=""
runoff_map=""

#---------------------------------------------------------------------------
# External boundaries
#---------------------------------------------------------------------------
num_extbc=0
extbc_dir=""
extbc_file=""

#---------------------------------------------------------------------------
# time_series_flag=1 to activate, 0 to deactivate
#---------------------------------------------------------------------------
observation_loc_file="../input/circular/circular_dambreak.obs"
time_series_flag=1

#---------------------------------------------------------------------------
# print_option=h to output just the h, huv to output all h,u and v
#---------------------------------------------------------------------------
print_option=huv

#---------------------------------------------------------------------------
# Start and duration of simulation time in seconds
#---------------------------------------------------------------------------
sim_start_time=0
sim_duration=25

#---------------------------------------------------------------------------
# If checkpoint_id is 0 that means a clean start
#---------------------------------------------------------------------------
checkpoint_id=0

#---------------------------------------------------------------------------
# time_increment_fixed=0 is for variable dt, 1 for constant dt
#---------------------------------------------------------------------------
time_increment_fixed=0
time_step=0.01

#---------------------------------------------------------------------------
# Spatial/temporal print (in seconds) & iteration output
#---------------------------------------------------------------------------
print_interval=25
print_observation=5
it_print=500

#---------------------------------------------------------------------------
# Initial input files
#---------------------------------------------------------------------------
h_infile="../input/circular/circular_dambreak.inith"
qx_infile=""
qy_infile=""

#---------------------------------------------------------------------------
# Other parameters
#---------------------------------------------------------------------------
it_count=0
courant=0.5
hextra=0.001
gpu_direct_flag=0
domain_decomposition=static
factor_interval_domain_decomposition=2
open_boundaries=0
